services:
  - type: web
    name: unifrendly-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install --no-audit --no-fund && npm run api:build
    startCommand: npm --workspace apps/api run start
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ORIGIN
        value: unifrendly://
