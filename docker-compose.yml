services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: unifrendly
      POSTGRES_USER: unifrendly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-admin-only-change-me}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-unifrendly_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-local-app-only-change-me}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-unifrendly_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-local-migrator-only-change-me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifrendly -d unifrendly"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  pgdata:
